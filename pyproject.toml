[project]
name = "telegram-cooking-bot"
version = "0.1.0"
description = "The Python cooking recipe bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.0",
    "pydantic-settings>=2.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.19.1",
    "redis>=5.0",
    "deep-translator>=1.11.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
